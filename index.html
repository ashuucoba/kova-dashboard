<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kova — Paper Trading Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root {
  --bg: #0a0a0f;
  --surface: #12121a;
  --surface2: #1a1a26;
  --border: #2a2a3a;
  --text: #e4e4ef;
  --text-dim: #8888a0;
  --amber: #f5a623;
  --amber-dim: #c78418;
  --green: #22c55e;
  --red: #ef4444;
  --blue: #3b82f6;
  --purple: #a855f7;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--bg); color: var(--text); font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace; font-size: 13px; }
.container { max-width: 1600px; margin: 0 auto; padding: 20px; }

/* Header */
.header { display: flex; align-items: center; justify-content: space-between; padding: 20px 0; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
.logo { display: flex; align-items: center; gap: 12px; }
.logo-icon { width: 40px; height: 40px; background: linear-gradient(135deg, var(--amber), var(--amber-dim)); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
.logo h1 { font-size: 24px; font-weight: 700; color: var(--amber); letter-spacing: 2px; }
.logo span { font-size: 11px; color: var(--text-dim); letter-spacing: 1px; }
.header-right { text-align: right; }
.status-badge { padding: 5px 12px; border-radius: 16px; font-size: 11px; letter-spacing: 1px; font-weight: 600; display: inline-block; }
.status-live { background: rgba(34,197,94,0.15); color: var(--green); border: 1px solid rgba(34,197,94,0.3); }
.last-update { font-size: 11px; color: var(--text-dim); margin-top: 4px; }

/* Stats Grid */
.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin-bottom: 20px; }
.stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 14px; }
.stat-label { font-size: 9px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 4px; }
.stat-value { font-size: 20px; font-weight: 700; }
.stat-sub { font-size: 10px; color: var(--text-dim); margin-top: 3px; }
.positive { color: var(--green); }
.negative { color: var(--red); }
.amber { color: var(--amber); }
.blue { color: var(--blue); }

/* Chart */
.chart-container { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-bottom: 20px; }
.section-title { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 12px; }
.chart-wrap { height: 260px; position: relative; }

/* Tables */
.table-container { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 20px; overflow-x: auto; }
.table-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--border); }
.table-title { font-size: 13px; font-weight: 600; color: var(--amber); }
.table-count { font-size: 10px; color: var(--text-dim); background: var(--surface2); padding: 2px 8px; border-radius: 8px; }
table { width: 100%; border-collapse: collapse; font-size: 11px; white-space: nowrap; }
th { padding: 8px 12px; text-align: left; color: var(--text-dim); font-weight: 500; text-transform: uppercase; letter-spacing: 0.8px; font-size: 9px; border-bottom: 1px solid var(--border); background: var(--surface2); position: sticky; top: 0; }
td { padding: 8px 12px; border-bottom: 1px solid rgba(42,42,58,0.4); }
tr:hover td { background: rgba(245,166,35,0.03); }
.dir-long { color: var(--green); font-weight: 600; }
.dir-short { color: var(--red); font-weight: 600; }
.tag { padding: 2px 6px; border-radius: 3px; font-size: 9px; font-weight: 600; text-transform: uppercase; }
.tag-crypto { background: rgba(59,130,246,0.15); color: var(--blue); }
.tag-commodity { background: rgba(245,166,35,0.15); color: var(--amber); }
.tag-stock { background: rgba(168,85,247,0.15); color: var(--purple); }
.tag-index { background: rgba(34,197,94,0.15); color: var(--green); }
.lev { color: var(--amber); font-weight: 600; }
.dim { color: var(--text-dim); }
.signal-type { color: var(--blue); font-weight: 500; }
.tf { color: var(--text-dim); font-size: 10px; }
.filter-tag { font-size: 9px; padding: 1px 4px; border-radius: 2px; }
.filter-none { background: rgba(136,136,160,0.1); color: var(--text-dim); }
.filter-trend { background: rgba(59,130,246,0.15); color: var(--blue); }
.filter-regime { background: rgba(239,68,68,0.15); color: var(--red); }
.filter-htf_trend { background: rgba(168,85,247,0.15); color: var(--purple); }
.pnl-bar { display: inline-block; height: 3px; border-radius: 1px; vertical-align: middle; margin-left: 4px; }

/* Breakdown */
.breakdown-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; margin-bottom: 20px; }
.breakdown-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 14px; }
.breakdown-bar { height: 3px; border-radius: 2px; background: var(--surface2); margin-top: 8px; overflow: hidden; }
.breakdown-fill { height: 100%; border-radius: 2px; }

/* Exposure */
.exposure-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; margin-bottom: 20px; }
.exposure-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 14px; }
.exposure-row { display: flex; justify-content: space-between; margin-top: 4px; font-size: 11px; }

/* Footer */
.footer { text-align: center; padding: 20px; color: var(--text-dim); font-size: 10px; border-top: 1px solid var(--border); }
.no-data { padding: 30px; text-align: center; color: var(--text-dim); font-size: 12px; }

@media (max-width: 768px) {
  .stats-grid { grid-template-columns: repeat(2, 1fr); }
  table { font-size: 10px; }
  th, td { padding: 6px 8px; }
  .container { padding: 12px; }
}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="logo">
      <div class="logo-icon">📊</div>
      <div><h1>KOVA</h1><span>PAPER TRADING DASHBOARD</span></div>
    </div>
    <div class="header-right">
      <div class="status-badge status-live" id="status">● V4 PAPER</div>
      <div class="last-update" id="lastUpdate">Loading...</div>
      <div class="last-update" id="config"></div>
    </div>
  </div>

  <!-- Stats -->
  <div class="stats-grid" id="statsGrid"></div>

  <!-- Exposure Summary -->
  <div class="exposure-grid" id="exposureGrid"></div>

  <!-- Equity Chart -->
  <div class="chart-container">
    <div class="section-title">Equity Curve (Realized + Unrealized)</div>
    <div class="chart-wrap"><canvas id="equityChart"></canvas></div>
  </div>

  <!-- Asset Class Breakdown -->
  <div class="breakdown-grid" id="breakdownGrid"></div>

  <!-- Open Positions -->
  <div class="table-container">
    <div class="table-header">
      <span class="table-title">📍 Open Positions</span>
      <span class="table-count" id="openCount">0</span>
    </div>
    <div id="openTable"></div>
  </div>

  <!-- Closed Trades -->
  <div class="table-container">
    <div class="table-header">
      <span class="table-title">📋 Closed Trades</span>
      <span class="table-count" id="closedCount">0</span>
    </div>
    <div id="closedTable"></div>
  </div>

  <div class="footer">
    KOVA v4 · 169 signals · 27 assets · 3 timeframes · DD scaling · Data updates every 30 min
  </div>
</div>

<script>
const CLASS_MAP = {
  'BTC':'crypto','ETH':'crypto','SOL':'crypto','XRP':'crypto','DOGE':'crypto',
  'ADA':'crypto','BNB':'crypto','LTC':'crypto','LINK':'crypto','AVAX':'crypto',
  'DOT':'crypto','MATIC':'crypto','OP':'crypto','RENDER':'crypto','AAVE':'crypto',
  'CRV':'crypto','NEAR':'crypto','PAXG':'crypto','SEI':'crypto','TIA':'crypto','TAO':'crypto',
  'XAU':'commodity','XAG':'commodity','Gold':'commodity','Silver':'commodity',
  'TSLA':'stock','AMZN':'stock','MSTR':'stock','PLTR':'stock','COIN':'stock',
  'SPX':'index','DIA':'index','SPY':'index'
};
function getClass(a) { return CLASS_MAP[a.replace('/USDT','').replace('_yf','')] || 'crypto'; }
function fmt(n, d=2) { return n == null ? '—' : Number(n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d}); }
function fmtPnl(n) { return n == null ? '—' : `${n>=0?'+':''}$${fmt(n)}`; }
function fmtPct(n) { return n == null ? '—' : `${n>=0?'+':''}${fmt(n,1)}%`; }
function timeAgo(ts) {
  const m = Math.floor((new Date() - new Date(ts))/60000);
  if (m<1) return 'just now'; if (m<60) return m+'m ago';
  const h = Math.floor(m/60); if (h<24) return h+'h ago'; return Math.floor(h/24)+'d ago';
}
function holdTime(ts) {
  const h = Math.floor((new Date() - new Date(ts))/3600000);
  if (h<1) return '<1h'; if (h<24) return h+'h'; return Math.floor(h/24)+'d '+h%24+'h';
}

async function loadData() {
  try { const r = await fetch('data.json?t='+Date.now()); return await r.json(); }
  catch(e) { return null; }
}

function renderStats(d) {
  const s = d.stats, pnl = d.effective_capital - d.initial_capital;
  const pnlPct = pnl/d.initial_capital*100;
  const ur = d.unrealized_pnl || 0;
  const wr = s.total_trades > 0 ? s.wins/s.total_trades*100 : 0;
  const totalExposure = (d.open_positions||[]).reduce((a,p) => a + (p.size||0), 0);

  const stats = [
    {l:'Starting Balance', v:`$${fmt(d.initial_capital)}`, c:'amber'},
    {l:'Realized Balance', v:`$${fmt(d.capital)}`, c: d.capital >= d.initial_capital ? 'positive':'negative'},
    {l:'Unrealized P&L', v:fmtPnl(ur), c: ur>=0?'positive':'negative', s:`${(d.open_positions||[]).length} positions`},
    {l:'Effective Balance', v:`$${fmt(d.effective_capital)}`, c: pnl>=0?'positive':'negative', s:fmtPct(pnlPct)},
    {l:'Win Rate', v:`${fmt(wr,1)}%`, c: wr>=55?'positive':wr>=45?'amber':'negative', s:`${s.wins}W / ${s.losses}L / ${s.expired||0}E`},
    {l:'Total Trades', v:s.total_trades, c:'amber', s:`${(d.open_positions||[]).length} open`},
    {l:'Max Drawdown', v:`${fmt(s.max_drawdown,1)}%`, c: s.max_drawdown>30?'negative':s.max_drawdown>15?'amber':'positive'},
    {l:'Profit Factor', v: s.profit_factor ? fmt(s.profit_factor) : '—', c: (s.profit_factor||0)>=1.5?'positive':(s.profit_factor||0)>=1?'amber':'negative'},
    {l:'Largest Win', v:fmtPnl(s.largest_win), c:'positive'},
    {l:'Largest Loss', v:fmtPnl(s.largest_loss), c:'negative'},
    {l:'Total Exposure', v:`$${fmt(totalExposure)}`, c:'blue', s:`${fmt(totalExposure/d.capital*100,0)}% of capital`},
  ];
  document.getElementById('statsGrid').innerHTML = stats.map(s =>
    `<div class="stat-card"><div class="stat-label">${s.l}</div><div class="stat-value ${s.c}">${s.v}</div>${s.s?`<div class="stat-sub">${s.s}</div>`:''}</div>`
  ).join('');
}

function renderExposure(d) {
  const pos = d.open_positions || [];
  if (!pos.length) { document.getElementById('exposureGrid').innerHTML = ''; return; }

  // By direction
  const longExp = pos.filter(p=>p.direction==='LONG').reduce((a,p)=>a+(p.size||0),0);
  const shortExp = pos.filter(p=>p.direction==='SHORT').reduce((a,p)=>a+(p.size||0),0);
  const netExp = longExp - shortExp;

  // By class
  const byClass = {};
  pos.forEach(p => {
    const cls = getClass(p.asset||'');
    byClass[cls] = (byClass[cls]||0) + (p.size||0);
  });

  // Total risk
  const totalRisk = pos.reduce((a,p) => a + (p.risk_amount||0), 0);

  document.getElementById('exposureGrid').innerHTML = `
    <div class="exposure-card">
      <div class="stat-label">Direction Exposure</div>
      <div class="exposure-row"><span class="positive">Long</span><span>$${fmt(longExp)}</span></div>
      <div class="exposure-row"><span class="negative">Short</span><span>$${fmt(shortExp)}</span></div>
      <div class="exposure-row" style="border-top:1px solid var(--border);padding-top:4px;margin-top:4px"><span class="amber">Net</span><span class="amber">$${fmt(netExp)}</span></div>
    </div>
    <div class="exposure-card">
      <div class="stat-label">Exposure by Class</div>
      ${Object.entries(byClass).map(([cls,val]) => `<div class="exposure-row"><span class="tag tag-${cls}">${cls}</span><span>$${fmt(val)}</span></div>`).join('')}
    </div>
    <div class="exposure-card">
      <div class="stat-label">Risk Summary</div>
      <div class="exposure-row"><span>Total at risk</span><span class="negative">$${fmt(totalRisk)}</span></div>
      <div class="exposure-row"><span>Risk % of capital</span><span>${fmt(totalRisk/d.capital*100,1)}%</span></div>
      <div class="exposure-row"><span>Avg risk/trade</span><span>$${fmt(totalRisk/pos.length)}</span></div>
    </div>
  `;
}

function renderEquityChart(d) {
  const ctx = document.getElementById('equityChart').getContext('2d');
  const eq = d.equity_curve || [];
  if (eq.length < 2) { document.querySelector('.chart-wrap').innerHTML = '<div class="no-data">Equity curve builds as data accumulates</div>'; return; }
  new Chart(ctx, {
    type:'line',
    data: { labels: eq.map(p => new Date(p.ts).toLocaleDateString('en-US',{month:'short',day:'numeric',hour:'2-digit'})),
      datasets: [{ data: eq.map(p=>p.capital), borderColor:'#f5a623', backgroundColor:'rgba(245,166,35,0.06)', fill:true, tension:0.3, pointRadius:0, borderWidth:2 }]
    },
    options: { responsive:true, maintainAspectRatio:false,
      plugins:{legend:{display:false}},
      scales:{ x:{grid:{color:'rgba(42,42,58,0.4)'},ticks:{color:'#8888a0',font:{size:9,family:'monospace'},maxTicksLimit:8}},
               y:{grid:{color:'rgba(42,42,58,0.4)'},ticks:{color:'#8888a0',font:{size:9,family:'monospace'},callback:v=>'$'+v.toLocaleString()}} }
    }
  });
}

function renderBreakdown(d) {
  const all = [...(d.open_positions||[]), ...(d.closed_trades||[])];
  if (!all.length) { document.getElementById('breakdownGrid').innerHTML = ''; return; }
  const classes = {};
  all.forEach(p => { const c=getClass(p.asset||''); if(!classes[c])classes[c]={trades:0,pnl:0,wins:0}; classes[c].trades++; classes[c].pnl+=(p.pnl_usd||p.unrealized_pnl||0); if((p.pnl_usd||p.unrealized_pnl||0)>0)classes[c].wins++; });
  const colors = {crypto:'#3b82f6',commodity:'#f5a623',stock:'#a855f7',index:'#22c55e'};
  const total = Object.values(classes).reduce((a,c)=>a+c.trades,0)||1;
  document.getElementById('breakdownGrid').innerHTML = Object.entries(classes).map(([c,d]) =>
    `<div class="breakdown-card"><div class="stat-label">${c.toUpperCase()}</div><div class="stat-value" style="font-size:15px;color:${colors[c]}">${d.trades} trades</div><div class="stat-sub">${fmtPnl(d.pnl)} · ${d.trades?fmt(d.wins/d.trades*100,0):0}% WR</div><div class="breakdown-bar"><div class="breakdown-fill" style="width:${d.trades/total*100}%;background:${colors[c]}"></div></div></div>`
  ).join('');
}

function renderOpen(d) {
  const pos = d.open_positions || [];
  document.getElementById('openCount').textContent = pos.length;
  if (!pos.length) { document.getElementById('openTable').innerHTML = '<div class="no-data">No open positions</div>'; return; }
  document.getElementById('openTable').innerHTML = `<table>
    <tr><th>Asset</th><th>Dir</th><th>Lev</th><th>Size</th><th>Risk</th><th>Signal</th><th>TF</th><th>Filter</th><th>Class</th><th>Entry</th><th>Current</th><th>P&L $</th><th>P&L %</th><th>Stop</th><th>Target</th><th>R:R</th><th>Sharpe</th><th>WR</th><th>N</th><th>RSI</th><th>Held</th><th>Max Hold</th></tr>
    ${pos.map(p => {
      const cls = getClass(p.asset||'');
      const pnl = p.unrealized_pnl||0;
      const maxH = p.hold_max_hours ? (p.hold_max_hours >= 24 ? Math.round(p.hold_max_hours/24)+'d' : p.hold_max_hours+'h') : '—';
      return `<tr>
        <td><strong>${p.asset}</strong></td>
        <td class="${p.direction==='LONG'?'dir-long':'dir-short'}">${p.direction}</td>
        <td class="lev">${p.leverage}x</td>
        <td>$${fmt(p.size)}</td>
        <td class="negative">$${fmt(p.risk_amount)}</td>
        <td class="signal-type">${p.signal_type||p.signal_name||'—'}</td>
        <td class="tf">${p.timeframe||'—'}</td>
        <td><span class="filter-tag filter-${p.filter||'none'}">${p.filter||'none'}</span></td>
        <td><span class="tag tag-${cls}">${cls}</span></td>
        <td>$${fmt(p.entry_price, p.entry_price<10?4:2)}</td>
        <td>$${fmt(p.current_price, p.current_price<10?4:2)}</td>
        <td class="${pnl>=0?'positive':'negative'}">${fmtPnl(pnl)}</td>
        <td class="${(p.pnl_pct||0)>=0?'positive':'negative'}">${fmtPct(p.pnl_pct)}</td>
        <td>$${fmt(p.stop, p.stop<10?4:2)} <span class="dim">(-${p.stop_pct||0}%)</span></td>
        <td>$${fmt(p.target, p.target<10?4:2)} <span class="dim">(+${p.target_pct||0}%)</span></td>
        <td>${p.rr_ratio ? fmt(p.rr_ratio,1)+':1' : '—'}</td>
        <td class="amber">${fmt(p.sharpe,1)}</td>
        <td>${fmt(p.wr,0)}%</td>
        <td class="dim">${p.n||'—'}</td>
        <td class="dim">${p.rsi_at_entry ? fmt(p.rsi_at_entry,0) : '—'}</td>
        <td>${p.opened_at ? holdTime(p.opened_at) : '—'}</td>
        <td class="dim">${maxH}</td>
      </tr>`;
    }).join('')}
  </table>`;
}

function renderClosed(d) {
  const trades = (d.closed_trades||[]).slice().reverse();
  document.getElementById('closedCount').textContent = trades.length;
  if (!trades.length) { document.getElementById('closedTable').innerHTML = '<div class="no-data">No closed trades yet — V4 just started</div>'; return; }
  document.getElementById('closedTable').innerHTML = `<table>
    <tr><th>Closed</th><th>Asset</th><th>Dir</th><th>Lev</th><th>Size</th><th>Signal</th><th>TF</th><th>Class</th><th>Entry</th><th>Exit</th><th>P&L $</th><th>P&L %</th><th>Reason</th><th>Held</th></tr>
    ${trades.slice(0,200).map(t => {
      const cls = getClass(t.asset||''); const pnl = t.pnl_usd||0;
      return `<tr>
        <td>${t.closed_at ? new Date(t.closed_at).toLocaleDateString('en-US',{month:'short',day:'numeric'}) + ' ' + new Date(t.closed_at).toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',hour12:false}) : '—'}</td>
        <td><strong>${t.asset}</strong></td>
        <td class="${t.direction==='LONG'?'dir-long':'dir-short'}">${t.direction}</td>
        <td class="lev">${t.leverage||1}x</td>
        <td>$${fmt(t.size)}</td>
        <td class="signal-type">${t.signal_type||t.signal_name||'—'}</td>
        <td class="tf">${t.timeframe||'—'}</td>
        <td><span class="tag tag-${cls}">${cls}</span></td>
        <td>$${fmt(t.entry_price)}</td>
        <td>$${fmt(t.exit_price)}</td>
        <td class="${pnl>=0?'positive':'negative'}">${fmtPnl(pnl)}<span class="pnl-bar" style="width:${Math.min(Math.abs(pnl)*2,60)}px;background:${pnl>=0?'var(--green)':'var(--red)'}"></span></td>
        <td class="${pnl>=0?'positive':'negative'}">${fmtPct(t.pnl_pct)}</td>
        <td>${t.exit_reason||'—'}</td>
        <td>${t.hold_time||'—'}</td>
      </tr>`;
    }).join('')}
  </table>`;
}

async function init() {
  const d = await loadData();
  if (!d) { document.querySelector('.container').innerHTML = '<div class="no-data" style="padding:80px">Failed to load data</div>'; return; }
  document.getElementById('lastUpdate').textContent = d.updated_at ? 'Updated '+timeAgo(d.updated_at) : '';
  document.getElementById('config').textContent = d.config || '';
  renderStats(d); renderExposure(d); renderEquityChart(d); renderBreakdown(d); renderOpen(d); renderClosed(d);
}
init();
setInterval(init, 300000);
</script>
</body>
</html>
